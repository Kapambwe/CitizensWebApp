<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#198754">
    <title>eCitizen - Offline</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7f9; color: #1f2937; }
        main { max-width: 30rem; padding: 2rem; text-align: center; background: white; border-radius: 12px; box-shadow: 0 8px 30px #0001; }
        button { border: 0; border-radius: 6px; padding: .7rem 1rem; background: #198754; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <h1>You are offline</h1>
        <p>The application shell is available, but this page needs a connection. Your saved drafts remain on this device.</p>
        <button onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
