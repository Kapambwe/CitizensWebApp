<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect all 404 routes to index.html and preserve path/query
      // This version is subdirectory-aware.
      (function() {
        var subpath = '/CitizensWebApp';
        var redirectTo = subpath + '/index.html' + location.search + location.hash;
        var path = location.pathname.replace(subpath, '');
        
        if (path && path !== '/index.html' && path !== '/') {
          var separator = location.search ? '&' : '?';
          redirectTo = subpath + '/index.html' + location.search + separator + 'path=' + encodeURIComponent(path) + location.hash;
        }
        
        window.location.replace(redirectTo);
      })();
    </script>
</head>
<body>
</body>
</html>
